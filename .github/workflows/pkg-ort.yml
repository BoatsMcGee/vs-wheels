name: MLRT-ORT

on:
  push:
    branches:
      - master
    paths:
      - vsmlrt/ort/**
      - .github/workflows/pkg-ort.yml
      - .github/actions/setup-cuda-*/**
      - .github/actions/setup-cudnn-*/**
      - .github/actions/setup-onnx-*/**
      - .github/actions/setup-onnxruntime-*/**
      - .github/cmake-cache/onnx-*/**
      - .github/cmake-cache/onnxruntime-*/**
  pull_request:
    paths:
      - vsmlrt/ort/**
      - .github/workflows/pkg-ort.yml
      - .github/actions/setup-cuda-*/**
      - .github/actions/setup-cudnn-*/**
      - .github/actions/setup-onnx-*/**
      - .github/actions/setup-onnxruntime-*/**
      - .github/cmake-cache/onnx-*/**
      - .github/cmake-cache/onnxruntime-*/**
  schedule:
    - cron: 39 4 2-30/4 * *
  workflow_call:
    inputs:
      version:
        description: Version override (SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT)
        type: string
        required: false
      cuda-windows:
        description: CUDA version for Windows (https://developer.nvidia.com/cuda-toolkit-archive)
        type: string
        required: false
      cuda-linux:
        description: CUDA version for Linux (https://developer.nvidia.com/cuda-toolkit-archive)
        type: string
        required: false
      onnxruntime-windows-tag:
        description: ONNX tag for Windows (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
      onnxruntime-linux-tag:
        description: ONNX tag for Linux (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
      cudnn-windows:
        description: cuDNN version for Windows
        type: string
        required: false
      cudnn-linux:
        description: cuDNN version for Linux
        type: string
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish built distributions
        type: boolean
        required: false
        default: false
      repository:
        description: Package index to publish to
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi
      version:
        description: Version override (SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT)
        type: string
        required: false
      onnxruntime-windows-tag:
        description: ONNX tag for Windows (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
        default: "v1.30.0" # renovate: datasource=github-tags depName=microsoft/onnxruntime
      onnxruntime-linux-tag:
        description: ONNX tag for Linux (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
        default: "v1.30.0" # renovate: datasource=github-tags depName=microsoft/onnxruntime
      onnxruntime-macos-tag:
        description: ONNX tag for macOS (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
        default: "v1.30.0" # renovate: datasource=github-tags depName=microsoft/onnxruntime
      cuda-windows:
        description: CUDA version for Windows (https://developer.nvidia.com/cuda-toolkit-archive)
        type: string
        required: false
        default: "13.4.1"
      cuda-linux:
        description: CUDA version for Linux (https://developer.nvidia.com/cuda-toolkit-archive)
        type: string
        required: false
        default: "13.4"
      cudnn-windows:
        description: cuDNN version for Windows (https://developer.nvidia.com/cudnn-downloads, https://developer.nvidia.com/cudnn-archive)
        type: string
        required: false
        default: "9.26.0.51" # renovate: datasource=pypi depName=nvidia-cudnn-cu13
      cudnn-linux:
        description: cuDNN version for Linux (https://developer.nvidia.com/cudnn-downloads, https://developer.nvidia.com/cudnn-archive)
        type: string
        required: false
        default: "9.26.0.51" # renovate: datasource=pypi depName=nvidia-cudnn-cu13

env:
  ONNXRUNTIME_WINDOWS_TAG: ${{ inputs.onnxruntime-windows-tag || 'v1.30.0' }} # renovate: datasource=github-tags depName=microsoft/onnxruntime
  ONNXRUNTIME_LINUX_TAG: ${{ inputs.onnxruntime-linux-tag || 'v1.30.0' }} # renovate: datasource=github-tags depName=microsoft/onnxruntime
  ONNXRUNTIME_MACOS_TAG: ${{ inputs.onnxruntime-macos-tag || 'v1.30.0' }} # renovate: datasource=github-tags depName=microsoft/onnxruntime
  CUDA_WINDOWS_VERSION: ${{ inputs.cuda-windows || '13.4.1' }}
  CUDA_LINUX_VERSION: ${{ inputs.cuda-linux || '13.4' }}
  CUDNN_WINDOWS_VERSION: ${{ inputs.cudnn-windows || '9.26.0.51' }} # renovate: datasource=pypi depName=nvidia-cudnn-cu13
  CUDNN_LINUX_VERSION: ${{ inputs.cudnn-linux || '9.26.0.51' }} # renovate: datasource=pypi depName=nvidia-cudnn-cu13
  PACKAGE_NAME: ort

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            container:
              image: quay.io/pypa/manylinux_2_28_x86_64
              options: --privileged --user root -v /:/host
            cuda_repo: rhel8/x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            container:
              image: quay.io/pypa/manylinux_2_28_aarch64
              options: --privileged --user root -v /:/host
            cuda_repo: rhel8/sbsa
          - name: Windows x64
            os: ${{ inputs.cuda-windows && startsWith(inputs.cuda-windows, '12') && 'windows-2022' || 'windows-2025-vs2026' }}
          - name: macOS ARM64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel

    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Disable Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true `
                           -DisableBehaviorMonitoring $true `
                           -DisableScriptScanning $true `
                           -DisableIOAVProtection $true
          Add-MpPreference -ExclusionPath "C:\", "D:\"
          Add-MpPreference -ExclusionProcess "cl.exe", "link.exe", "ninja.exe", "nvcc.exe", "cicc.exe" -ErrorAction SilentlyContinue

      - name: Verify Defender Status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pref = Get-MpPreference
          Write-Host "Realtime Monitoring Disabled: $($pref.DisableRealtimeMonitoring)"
          Write-Host "Excluded Paths: $($pref.ExclusionPath -join ', ')"
          Write-Host "Excluded Processes: $($pref.ExclusionProcess -join ', ')"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive vsmlrt/${{ env.PACKAGE_NAME }}/vs-mlrt

      - name: Free host runner space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Host disk space before ==="
          df -h /host
          echo "=== Purging host preinstalled bloat ==="
          rm -rf /host/usr/share/dotnet
          rm -rf /host/usr/local/lib/android
          rm -rf /host/opt/ghc
          rm -rf /host/opt/hostedtoolcache/CodeQL
          rm -rf /host/opt/hostedtoolcache/Java*
          rm -rf /host/usr/local/share/boost
          echo "=== Host disk space after ==="
          df -h /host

          echo "=== Creating 16G swapfile on host ==="
          if [ ! -f /host/swapfile_extra ]; then
            dd if=/dev/zero of=/host/swapfile_extra bs=1M count=16384 status=none
            chmod 600 /host/swapfile_extra
            mkswap /host/swapfile_extra
            swapon /host/swapfile_extra
          fi
          cat /proc/swaps
          free -h

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          uv tool install cmake
          uv tool install ninja
          uv tool install auditwheel
          uv tool install patchelf
          uv tool install wheel

      - name: Adjust ONNX Runtime architectures for CUDA version
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: uv run --script .github/cuda12-cmake-cache.py .github/cmake-cache/onnxruntime-cuda.cmake

      - name: Build ONNX Runtime dependency (Windows)
        if: runner.os == 'Windows'
        id: setup-onnxruntime-windows
        uses: ./.github/actions/setup-onnxruntime-windows
        with:
          onnxruntime-tag: ${{ env.ONNXRUNTIME_WINDOWS_TAG }}
          build-cuda: true
          cuda-version: ${{ env.CUDA_WINDOWS_VERSION }}
          cudnn-version: ${{ env.CUDNN_WINDOWS_VERSION }}
          os: ${{ matrix.container.image || matrix.container || matrix.os }}

      - name: Build ONNX Runtime dependency (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-onnxruntime-linux
        with:
          onnxruntime-tag: ${{ env.ONNXRUNTIME_LINUX_TAG }}
          build-cuda: true
          cuda-version: ${{ env.CUDA_LINUX_VERSION }}
          cuda-repo: ${{ matrix.cuda_repo }}
          cudnn-version: ${{ env.CUDNN_LINUX_VERSION }}
          os: ${{ matrix.container.image || matrix.container || matrix.os }}

      - name: Prune ONNX Runtime build artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf build_onnxruntime
          dnf clean all && rm -rf /var/cache/dnf

      - name: Build ONNX Runtime dependency (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-onnxruntime-macos
        with:
          onnxruntime-tag: ${{ env.ONNXRUNTIME_MACOS_TAG }}
          os: ${{ matrix.os }}

      - name: Get ONNX version from ONNX Runtime
        id: get-onnx-version
        shell: bash
        run: |
          git -C onnxruntime/cmake/external/onnx/ fetch --tags --depth=1 2>/dev/null || true
          version=$(git -C onnxruntime/cmake/external/onnx/ describe --exact-match --tags 2>/dev/null || git -C onnxruntime/cmake/external/onnx/ rev-parse HEAD)
          echo "version=$version" | tee -a $GITHUB_OUTPUT

      - name: Prune ONNX Runtime source tree (Linux)
        if: runner.os == 'Linux'
        run: rm -rf onnxruntime

      - name: Build ONNX dependency (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-onnx-windows
        with:
          onnx-tag: ${{ steps.get-onnx-version.outputs.version }}
          os: ${{ matrix.container.image || matrix.container || matrix.os }}
          msvc-runtime: MultiThreadedDLL

      - name: Build ONNX dependency (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-onnx-linux
        with:
          onnx-tag: ${{ steps.get-onnx-version.outputs.version }}
          os: ${{ matrix.container.image || matrix.container || matrix.os }}

      - name: Build ONNX dependency (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-onnx-macos
        with:
          onnx-tag: ${{ steps.get-onnx-version.outputs.version }}
          os: ${{ matrix.os }}

      - name: Build wheel
        run: uv build --package vapoursynth-mlrt-${{ env.PACKAGE_NAME }} -C "cmake.define.INSTALL_CUDA=OFF"
        env:
          DML_DIR: ${{ steps.setup-onnxruntime-windows.outputs.dml-path }}
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT: ${{ inputs.version }}

      - name: Adjust ort-cuda nvidia dependencies for CUDA version
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CUDA_MAJOR=$(echo "${{ env.CUDA_WINDOWS_VERSION }}" | cut -d. -f1); else CUDA_MAJOR=$(echo "${{ env.CUDA_LINUX_VERSION }}" | cut -d. -f1); fi
          pyproject="vsmlrt/ort/cuda/pyproject.toml"
          if [ "$CUDA_MAJOR" -lt 13 ]; then
            # CUDA 12: nvidia PyPI packages use the -cu12 suffix
            # The optional cuFFT extra is the CUDA 13 build (cuFFT 12.x); CUDA 12 needs cuFFT 11.x.
            sed -i "s/\"nvidia-cublas>=/\"nvidia-cublas-cu12>=/g; s/\"nvidia-cuda-runtime>=/\"nvidia-cuda-runtime-cu12>=/g; s/\"nvidia-cuda-cupti>=/\"nvidia-cuda-cupti-cu12>=/g; s/\"nvidia-curand>=/\"nvidia-curand-cu12>=/g; s/nvidia-cudnn-cu13/nvidia-cudnn-cu12/g; s/\"nvidia-cufft>=12\.0\.0,<13\.0\.0/\"nvidia-cufft-cu12>=11.4.0,<12.0.0/g; s/>=13\.0\.0,<14\.0\.0/>=${CUDA_MAJOR}.0.0,<13.0.0/g" "$pyproject"
            grep -q "nvidia-nvjitlink-cu12" "$pyproject" || sed -i "s/\"nvidia-curand-cu12>=10.0.0,<11.0.0\"/\"nvidia-curand-cu12>=10.0.0,<11.0.0\",\n    \"nvidia-nvjitlink-cu12>=12.0.0,<13.0.0\"/" "$pyproject"
          fi
          echo "ort-cuda dependencies set for CUDA ${CUDA_MAJOR}"
          cat "$pyproject" | head -25

      - name: Build CUDA provider wheel
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: uv build --wheel --package vapoursynth-mlrt-${{ env.PACKAGE_NAME }}-cuda
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT_CUDA: ${{ inputs.version }}

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          auditwheel repair \
            --exclude libonnxruntime.so* \
            --exclude libonnxruntime_providers_cuda.so* \
            --exclude libonnxruntime_providers_shared.so* \
            --exclude libcudnn.so* \
            --exclude libcudnn_*.so* \
            --exclude libcublas.so* \
            --exclude libcublasLt.so* \
            --exclude libcudart.so* \
            --exclude libcufft.so* \
            --exclude libcurand.so* \
            --exclude libnvrtc.so* \
            --exclude libcuda.so* \
            --strip dist/*.whl \
            -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/

          # Fix RPATH for all bundled libraries in repaired wheels to ensure they find nvidia PyPI packages via $ORIGIN
          echo "=== Patching RPATHs inside repaired wheels ==="
          for whl in dist/*.whl; do
            [ -f "$whl" ] || continue
            echo "Processing wheel: $(basename "$whl")"
            tmpdir=$(mktemp -d)
            wheel unpack "$whl" -d "$tmpdir"
            unpacked=$(ls -d "$tmpdir"/*)
            for f in "$unpacked"/vapoursynth/plugins/ort/*.so*; do
              if [ -f "$f" ] && [ ! -L "$f" ]; then
                echo "  Setting RPATH on: $(basename "$f")"
                CUDA_MAJOR=$(echo "${{ env.CUDA_LINUX_VERSION }}" | cut -d. -f1)
                patchelf --set-rpath "\$ORIGIN:\$ORIGIN/../../../nvidia/cu${CUDA_MAJOR}/lib:\$ORIGIN/../../../nvidia/cudnn/lib" "$f"
              fi
            done
            rm "$whl"
            wheel pack "$unpacked" -d dist/
            rm -rf "$tmpdir"
          done

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          uvx --from delocate delocate-wheel -v dist/*.whl -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/
          uvx --from delocate delocate-listdeps dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-generic-wheels-${{ matrix.name }}
          path: |
            ./dist/*.whl
            !./dist/*_cuda-*.whl

      - name: Upload CUDA provider wheel
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-cuda-wheels-${{ matrix.name }}
          path: ./dist/*_cuda-*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: >-
          git submodule update --init --recursive
          vsmlrt/${{ env.PACKAGE_NAME }}/vs-mlrt
         

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist --package vapoursynth-mlrt-${{ env.PACKAGE_NAME }}
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT: ${{ inputs.version }}

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-generic-sdist
          path: dist/*.tar.gz

      - name: Generate metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.repository == 'pypi'
        run: |
          VERSION=$(uvx pkginfo dist/*.tar.gz | grep "^version:" | cut -d' ' -f2)
          cat << EOF > metadata.json
          {
            "package": "vapoursynth-mlrt-${{ env.PACKAGE_NAME }}",
            "version": "$VERSION",
            "onnxruntime_windows": "${{ env.ONNXRUNTIME_WINDOWS_TAG }}",
            "onnxruntime_linux": "${{ env.ONNXRUNTIME_LINUX_TAG }}",
            "onnxruntime_macos": "${{ env.ONNXRUNTIME_MACOS_TAG }}",
            "cuda_windows": "${{ env.CUDA_WINDOWS_VERSION }}",
            "cuda_linux": "${{ env.CUDA_LINUX_VERSION }}",
            "cudnn_windows": "${{ env.CUDNN_WINDOWS_VERSION }}",
            "cudnn_linux": "${{ env.CUDNN_LINUX_VERSION }}"
          }
          EOF

      - name: Upload metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.repository == 'pypi'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-metadata
          path: metadata.json

  trigger-publish:
    name: Trigger ${{ inputs.repository }} publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_URL: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        run: >-
          gh workflow run cd-publish.yml
          -f artifact-pattern=${{ env.PACKAGE_NAME }}-generic-*
          -f package=vapoursynth-mlrt-${{ env.PACKAGE_NAME }}
          -f packages-dir=dist
          -f repository=${{ inputs.repository }}
          -f repository-url="$REPOSITORY_URL"
          -f run-id=${{ github.run_id }}
          --ref ${{ github.ref_name }}

      - name: Trigger CUDA provider publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_URL: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        run: >-
          gh workflow run cd-publish.yml
          -f artifact-pattern=${{ env.PACKAGE_NAME }}-cuda-*
          -f package=vapoursynth-mlrt-${{ env.PACKAGE_NAME }}-cuda
          -f packages-dir=dist
          -f repository=${{ inputs.repository }}
          -f repository-url="$REPOSITORY_URL"
          -f run-id=${{ github.run_id }}
          --ref ${{ github.ref_name }}
