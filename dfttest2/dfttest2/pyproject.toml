[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "dfttest2"
dynamic = ["version", "readme"]
description = "DFTTest re-implementation"
license = "GPL-3.0-or-later"
license-files = ["vs-dfttest2/LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "WolframRhodium" }]
maintainers = [{ name = "Vardë", email = "ichunjo.le.terrible@gmail.com" }]
dependencies = ["vapoursynth>=75"]

[project.optional-dependencies]
cuda = ["vapoursynth-dfttest2_cuda>=11.0.0", "vapoursynth-dfttest2_nvrtc>=11.0.0"]
hip = ["vapoursynth-dfttest2_hip>=11.0.0", "vapoursynth-dfttest2_hiprtc>=11.0.0"]
cufft = ["vapoursynth-dfttest2_cuda>=11.0.0"]
nvrtc = ["vapoursynth-dfttest2_nvrtc>=11.0.0"]
hipfft = ["vapoursynth-dfttest2_hip>=11.0.0"]
hiprtc = ["vapoursynth-dfttest2_hiprtc>=11.0.0"]
cpu = ["vapoursynth-dfttest2_cpu>=11.0.0"]
gcc = ["vapoursynth-dfttest2-gcc>=11.0.0"]

# windows = ["dfttest2[cuda,hip,gcc,cpu]"]
# linux = [
#     "dfttest2[cuda,hip,gcc,cpu] ; platform_machine == 'x86_64'",
#     "dfttest2[cuda,gcc] ; platform_machine == 'aarch64'",
# ]
# macos = [
#     "dfttest2[cpu,gcc] ; platform_machine == 'x86_64'",
#     "dfttest2[gcc] ; platform_machine == 'arm64'",
# ]

[project.urls]
"Source Code" = "https://github.com/Ichunjo/vs-dfttest2"
"Bug Tracker" = "https://github.com/Ichunjo/vs-dfttest2/issues"
"Repository" = "https://github.com/Jaded-Encoding-Thaumaturgy/vs-wheels"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+.*)$'

[tool.hatch.version.raw-options]
root = "vs-dfttest2"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
include = ["vs-dfttest2"]

[tool.hatch.build.targets.wheel]
include = ["vs-dfttest2/python"]

[tool.hatch.build.targets.wheel.sources]
"vs-dfttest2/python" = "dfttest2"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }, { path = "vs-dfttest2/README.md" }]

[tool.uv.sources]
vapoursynth-dfttest2-gcc = { workspace = true }
vapoursynth-dfttest2-cpu = { workspace = true }
vapoursynth-dfttest2-cuda = { workspace = true }
vapoursynth-dfttest2-nvrtc = { workspace = true }
vapoursynth-dfttest2-hip = { workspace = true }
vapoursynth-dfttest2-hiprtc = { workspace = true }
